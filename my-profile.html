<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>AniGamble HQ — My Profile</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/dashboard.css"/>
  <link rel="stylesheet" href="css/animations.css"/>
  <style>
    /* ── Profile Hero ─────────────────────────────────── */
    .profile-hero {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 1.25rem;
      position: relative;
    }

    .hero-banner {
      height: 96px;
      background: linear-gradient(135deg, #2a1f5e 0%, #1a1040 40%, #0f1a35 100%);
      position: relative;
      overflow: hidden;
    }

    .hero-banner::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(124,93,250,0.35) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(167,139,250,0.2) 0%, transparent 50%);
    }

    .hero-banner-dots {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .hero-body {
      padding: 0 1.5rem 1.5rem;
      position: relative;
    }

    .hero-avatar-wrap {
      position: relative;
      display: inline-block;
      margin-top: -36px;
      margin-bottom: 0.75rem;
    }

    .hero-avatar-wrap .avatar,
    .hero-avatar-wrap img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--bg-2);
      object-fit: cover;
      font-size: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
    }

    .hero-online-dot {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 14px;
      height: 14px;
      background: var(--success);
      border-radius: 50%;
      border: 2.5px solid var(--bg-2);
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .hero-meta {
      font-size: 12.5px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .hero-bio {
      font-size: 13px;
      color: var(--text-2);
      margin-top: 0.5rem;
      line-height: 1.55;
    }

    .hero-actions {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      display: flex;
      gap: 8px;
    }

    .sign-out-btn {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.4rem 0.9rem;
      font-size: 12px;
      color: var(--text-3);
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }
    .sign-out-btn:hover { color: var(--text); border-color: var(--text-3); }

    /* ── Stats Row ────────────────────────────────────── */
    .stats-ribbon {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .stat-pill {
      background: var(--bg-2);
      padding: 1rem;
      text-align: center;
    }

    .stat-pill-val {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .stat-pill-label {
      font-size: 10.5px;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    @media(max-width: 540px) {
      .stats-ribbon { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Grid layout ──────────────────────────────────── */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    @media(max-width: 700px) {
      .profile-grid { grid-template-columns: 1fr; }
    }

    .profile-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
    }

    .profile-card.full-width {
      grid-column: 1 / -1;
    }

    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Balance ──────────────────────────────────────── */
    .balance-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .balance-item:last-child { border-bottom: none; }

    .balance-item-label {
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-item-val {
      font-family: var(--font-display);
      font-weight: 600;
    }

    .balance-total .balance-item-val {
      color: var(--gold);
      font-size: 15px;
    }

    /* ── PP History ───────────────────────────────────── */
    .pp-history-list { display: flex; flex-direction: column; gap: 0; }

    .pp-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }

    .pp-entry:last-child { border-bottom: none; }

    .pp-entry-label { color: var(--text-2); }

    .pp-entry-time { font-size: 11px; color: var(--text-3); margin-top: 1px; }

    .pp-entry-pts {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 13px;
    }

    .pp-entry-pts.gain { color: #a78bfa; }
    .pp-entry-pts.loss { color: var(--danger); }

    /* ── Inventory ────────────────────────────────────── */
    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
    }

    .inv-item {
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.6rem 0.75rem;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s;
    }

    .inv-item:hover { border-color: var(--accent); }
    .inv-empty { font-size: 12px; color: var(--text-3); padding: 0.5rem 0; }

    /* ── Win rate bar ─────────────────────────────────── */
    .wr-bar-wrap {
      background: var(--bg-3);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
      margin: 0.5rem 0 0.25rem;
    }

    .wr-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #7C5DFA, #a78bfa);
      transition: width 1s ease;
    }

    /* ── Rank badge ───────────────────────────────────── */
    .rank-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(212,167,23,0.12);
      border: 1px solid rgba(212,167,23,0.25);
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* ── Game to profile promo ────────────────────────── */
    .games-promo {
      background: linear-gradient(135deg, rgba(124,93,250,0.12) 0%, rgba(167,139,250,0.06) 100%);
      border: 1px solid rgba(124,93,250,0.2);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .promo-text { font-size: 13px; color: var(--text-2); line-height: 1.5; }
    .promo-title { font-weight: 600; color: var(--text); margin-bottom: 2px; font-size: 14px; }

    .promo-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.25rem;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font-display);
      text-decoration: none;
      display: inline-block;
      white-space: nowrap;
      transition: opacity 0.15s;
    }
    .promo-btn:hover { opacity: 0.88; }

    /* ── Skeleton loader ──────────────────────────────── */
    .skel {
      background: linear-gradient(90deg, var(--bg-3) 25%, var(--border) 50%, var(--bg-3) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
      height: 14px;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* ── Nav ──────────────────────────────────────────── */
    .top-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .top-nav-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }

    .top-nav-links {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-pill {
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-2);
      color: var(--text-3);
      font-size: 12px;
      text-decoration: none;
      transition: all 0.15s;
      font-family: var(--font-body);
    }
    .nav-pill:hover { color: var(--text); border-color: var(--text-3); }
    .nav-pill.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
  </style>
</head>
<body>
<div class="main" style="max-width:860px; margin:0 auto; padding:1.25rem 1rem;">

  <!-- Top nav -->
  <div class="top-nav fade-in">
    <a href="index.html" class="top-nav-brand">
      🎴 <span>AniGamble HQ</span>
    </a>
    <div class="top-nav-links">
      <a href="leaderboard.html" class="nav-pill">🏆 Leaderboard</a>
      <a href="games.html" class="nav-pill">🎮 Games</a>
      <button class="nav-pill" onclick="memberLogout()" style="cursor:pointer;">Sign out</button>
    </div>
  </div>

  <!-- Loading state -->
  <div id="loading-state">
    <div class="profile-hero" style="margin-bottom:1.25rem;">
      <div class="hero-banner"><div class="hero-banner-dots"></div></div>
      <div class="hero-body" style="padding-top: 0.75rem;">
        <div class="skel" style="width:72px;height:72px;border-radius:50%;margin-top:-36px;margin-bottom:0.75rem;"></div>
        <div class="skel" style="width:200px;height:20px;margin-bottom:8px;"></div>
        <div class="skel" style="width:140px;height:12px;"></div>
      </div>
    </div>
  </div>

  <!-- Profile content (filled by JS) -->
  <div id="profile-content" style="display:none;"></div>

  <!-- Not found -->
  <div id="not-found" style="display:none;" class="card fade-in" style="text-align:center;padding:3rem;">
    <div style="font-size:48px;margin-bottom:1rem;">🔍</div>
    <div style="font-size:16px;font-weight:600;margin-bottom:0.5rem;">Profile not found</div>
    <div style="font-size:13px;color:var(--text-3);margin-bottom:1.5rem;">Your session may have expired.</div>
    <a href="member-login.html" class="promo-btn">Log in again</a>
  </div>

</div>

<script src="data/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  function memberLogout() {
    sessionStorage.removeItem('agi_member_phone');
    sessionStorage.removeItem('agi_member_name');
    window.location.href = 'member-login.html';
  }

  function timeAgoFull(ts) {
    if (!ts) return '—';
    const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function renderProfile(user) {
    const stats = App.ppStats(user.ppHistory);
    const winRate = stats.games > 0 ? Math.round((stats.wins / stats.games) * 100) : 0;

    // PP history last 8 entries
    const recentPP = user.ppHistory.slice(-8).reverse().map(h => {
      const d = new Date(h.ts || h.time || 0);
      const timeStr = isNaN(d) ? '' : App.timeAgo(d);
      return `
        <div class="pp-entry">
          <div>
            <div class="pp-entry-label">${h.label || h.game || 'Game'}</div>
            <div class="pp-entry-time">${timeStr}</div>
          </div>
          <div class="pp-entry-pts ${h.pts > 0 ? 'gain' : 'loss'}">${h.pts > 0 ? '+' : ''}${h.pts} ◈</div>
        </div>
      `;
    }).join('') || '<div class="inv-empty">No activity yet — play a game! 🎮</div>';

    const cardItems = user.cards.length
      ? user.cards.map(c => `<div class="inv-item"><span>🃏</span><span>${c.name || c}</span></div>`).join('')
      : '<div class="inv-empty">No cards yet</div>';

    const souvItems = user.souvenirs.length
      ? user.souvenirs.map(s => `<div class="inv-item"><span>🎁</span><span>${s.name || s}</span></div>`).join('')
      : '<div class="inv-empty">No souvenirs yet</div>';

    const guildBadge = user.guild
      ? `<div class="hero-meta-item">⚔️ ${user.guild}</div>`
      : '';

    const joinDate = user.joinedAt ? timeAgoFull(user.joinedAt) : null;

    // Rank on leaderboard is unknown here; show what we can
    const roleBadge = user.role ? App.roleBadge(user.role) : '';

    return `
      <!-- Profile hero -->
      <div class="profile-hero fade-in">
        <div class="hero-banner">
          <div class="hero-banner-dots"></div>
        </div>
        <div class="hero-body">
          <div class="hero-actions">
            <button class="sign-out-btn" onclick="memberLogout()">Sign out</button>
          </div>
          <div class="hero-avatar-wrap">
            ${App.renderAvatar(user, 72)}
            <div class="hero-online-dot" title="Online now"></div>
          </div>
          <div class="hero-name">
            ${user.name}
            ${roleBadge}
          </div>
          <div class="hero-meta">
            <div class="hero-meta-item">📱 ${user.phone || user.id}</div>
            ${guildBadge}
            ${joinDate ? `<div class="hero-meta-item">📅 Joined ${joinDate}</div>` : ''}
          </div>
          ${user.bio ? `<div class="hero-bio">${user.bio}</div>` : ''}
        </div>
      </div>

      <!-- Stats ribbon -->
      <div class="stats-ribbon fade-in">
        <div class="stat-pill">
          <div class="stat-pill-val gold">${App.formatCoins(user.netWorth)}</div>
          <div class="stat-pill-label">Net Worth</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-val purple">◈ ${user.primePoints.toLocaleString()}</div>
          <div class="stat-pill-label">Prime Points</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-val">${user.cards.length}</div>
          <div class="stat-pill-label">Cards</div>
        </div>
        <div class="stat-pill">
          <div class="stat-pill-val green">${winRate}%</div>
          <div class="stat-pill-label">Win Rate</div>
        </div>
      </div>

      <!-- Games promo -->
      <div class="games-promo fade-in">
        <div>
          <div class="promo-title">🎮 Ready to play?</div>
          <div class="promo-text">Bet Prime Points, earn more, and climb the leaderboard.</div>
        </div>
        <a href="games.html" class="promo-btn">Open Games →</a>
      </div>

      <!-- Main grid -->
      <div class="profile-grid">

        <!-- Balance card -->
        <div class="profile-card fade-in">
          <div class="card-title">💰 Wallet</div>

          <div class="balance-item">
            <div class="balance-item-label">🪙 Wallet (Prime Coins)</div>
            <div class="balance-item-val gold">${App.formatCoins(user.coins)}</div>
          </div>
          <div class="balance-item">
            <div class="balance-item-label">🏦 Bank</div>
            <div class="balance-item-val">${App.formatCoins(user.bank)}</div>
          </div>
          <div class="balance-item balance-total">
            <div class="balance-item-label"><strong>Net Worth</strong></div>
            <div class="balance-item-val">${App.formatCoins(user.netWorth)}</div>
          </div>

          <div style="margin-top:1.25rem;">
            <div class="card-title">◈ Prime Points</div>
            <div class="balance-item">
              <div class="balance-item-label">Current balance</div>
              <div class="balance-item-val purple">◈ ${user.primePoints.toLocaleString()}</div>
            </div>
            <div class="balance-item">
              <div class="balance-item-label">Total earned</div>
              <div class="balance-item-val">◈ ${stats.totalEarned.toLocaleString()}</div>
            </div>
            <div class="balance-item">
              <div class="balance-item-label">Total spent</div>
              <div class="balance-item-val">◈ ${stats.totalSpent.toLocaleString()}</div>
            </div>
          </div>
        </div>

        <!-- Game stats card -->
        <div class="profile-card fade-in">
          <div class="card-title">🎮 Game Stats</div>

          <div class="balance-item">
            <div class="balance-item-label">Games played</div>
            <div class="balance-item-val">${stats.games}</div>
          </div>
          <div class="balance-item">
            <div class="balance-item-label">Wins</div>
            <div class="balance-item-val green">${stats.wins}</div>
          </div>
          <div class="balance-item">
            <div class="balance-item-label">Losses</div>
            <div class="balance-item-val" style="color:var(--danger);">${stats.losses}</div>
          </div>
          <div class="balance-item">
            <div class="balance-item-label">Win rate</div>
            <div class="balance-item-val">${winRate}%</div>
          </div>

          <div class="wr-bar-wrap">
            <div class="wr-bar-fill" id="wr-bar" style="width:0%"></div>
          </div>
          <div style="font-size:11px;color:var(--text-3);display:flex;justify-content:space-between;">
            <span>0%</span>
            <span>${winRate}% win rate</span>
            <span>100%</span>
          </div>
        </div>

        <!-- PP Activity -->
        <div class="profile-card fade-in">
          <div class="card-title">📋 Recent PP Activity</div>
          <div class="pp-history-list">${recentPP}</div>
        </div>

        <!-- Cards -->
        <div class="profile-card fade-in">
          <div class="card-title">🃏 Cards (${user.cards.length})</div>
          <div class="inv-grid">${cardItems}</div>

          ${user.souvenirs.length > 0 ? `
          <div class="card-title" style="margin-top:1.25rem;">🎁 Souvenirs (${user.souvenirs.length})</div>
          <div class="inv-grid">${souvItems}</div>
          ` : ''}
        </div>

      </div>
    `;
  }

  async function loadMyProfile() {
    const phone = sessionStorage.getItem('agi_member_phone');
    if (!phone) {
      window.location.href = 'member-login.html';
      return;
    }

    const raw = await API.getUserByPhone(phone);
    const user = App.parseUser(raw?.[0]);

    document.getElementById('loading-state').style.display = 'none';

    if (!user) {
      document.getElementById('not-found').style.display = 'block';
      return;
    }

    document.getElementById('profile-content').style.display = 'block';
    document.getElementById('profile-content').innerHTML = renderProfile(user);

    // Animate win rate bar after render
    requestAnimationFrame(() => {
      const stats = App.ppStats(user.ppHistory);
      const winRate = stats.games > 0 ? Math.round((stats.wins / stats.games) * 100) : 0;
      setTimeout(() => {
        const bar = document.getElementById('wr-bar');
        if (bar) bar.style.width = winRate + '%';
      }, 100);
    });

    // Update page title
    document.title = `${user.name} — AniGamble HQ`;
  }

  document.addEventListener('DOMContentLoaded', loadMyProfile);
</script>
</body>
</html>
